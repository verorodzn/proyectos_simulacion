<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8 Reinas </title>
  <link
  href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap"
  rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bee">

  <h1>Juego de las 8 Reinas</h1>

  <!-- Mensaje de victoria -->
  <div class="win-msg" id="winMsg">
    <span class="win-title">¡Ganaste!</span>
    <span class="win-sub">¡Ninguna reina se ataca!</span>
  </div>

  <div class="main-layout">

    <!-- TABLERO -->
    <div class="board-section">
      <div class="col-labels" id="colLabels"></div>
      <div id="board"></div>
    </div>

    <!--PANEL LATERAL -->
    <div class="panel">

       <!-- Botón reiniciar -->
      <button class="reset-btn" onclick="resetBoard()"> Reiniciar tablero</button>

      <!-- Contador -->
      <div class="card">
        <div class="card-title">Progreso</div>
        <div class="counter">
          <span class="num" id="queenCount">0</span>
          <span class="den">/ 8</span>
          <div class="counter-sub">Reinas colocadas</div>
        </div>

        <!-- Barra de progreso -->
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <!-- Selector de tema -->
      <div class="card">
        <div class="card-title">Tema</div>
        <div class="theme-buttons">
          <button class="theme-btn active"
            onclick="setTheme('bee', this)"
            title="Abeja">
                🐝<span>Abeja</span>
          </button>

          <button class="theme-btn"
            onclick="setTheme('sweet', this)"
            title="Dulce">
                🧁<span>Postre</span>
          </button>

          <button class="theme-btn"
            onclick="setTheme('cloud', this)"
            title="Nube">
                ☁️<span>Nube</span>
          </button>
        </div>
      </div>

      <!-- Soluciones -->
      <div class="card">
        <div class="card-title">Soluciones</div>
        <p class="card-hint">Haz clic para ver una solución válida</p>
        <div class="solutions-list">
          <button class="sol-btn" onclick="applySolution([0,4,7,5,2,6,1,3])">
            <span class="sol-num">1</span> Solución clásica
          </button>
          <button class="sol-btn" onclick="applySolution([0,5,7,2,6,3,1,4])">
            <span class="sol-num">2</span> Solución espejo
          </button>
          <button class="sol-btn" onclick="applySolution([0,6,3,5,7,1,4,2])">
            <span class="sol-num">3</span> Solución diagonal
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="js/functions.js"></script>
</body>
</html>
